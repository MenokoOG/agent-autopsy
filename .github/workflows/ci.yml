name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Lint
        run: ruff check .
      - name: Typecheck
        # Each case folder reuses module names, so check one file at a time.
        run: |
          for f in [0-9]*/*.py [0-9]*/tests/*.py; do
            mypy "$f" --ignore-missing-imports
          done
      - name: Test
        run: pytest --maxfail=1 --disable-warnings -q
