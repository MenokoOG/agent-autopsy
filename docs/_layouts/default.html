<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- assign page_title = site.title -%}
  {%- if page.title and page.layout != 'home' -%}{%- assign page_title = page.title | append: ' | ' | append: site.title -%}{%- endif -%}
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#1A1A2E">
  <script>try{if(localStorage.getItem('aa-fx')==='off')document.documentElement.classList.add('fx-off')}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/retro.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
  <a class="skip" href="#main">Skip to content</a>
  <div class="crt" aria-hidden="true"></div>
  <div class="crt-vignette" aria-hidden="true"></div>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/retro.js' | relative_url }}" defer></script>
</body>
</html>
